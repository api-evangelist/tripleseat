  - type: Features
    data:
      - name: Lead Capture
        description: >-
          Capture inquiries through the public lead form API and the leads
          endpoints, routing leads to the correct location.
      - name: Event And Booking Management
        description: >-
          Retrieve and manage events and bookings across the sales lifecycle.
      - name: Account And Contact CRM
        description: >-
          Maintain accounts and their associated contacts for customer records.
      - name: Webhooks
        description: >-
          Subscribe to lead and booking lifecycle events, verified with a
          SHA256-HMAC X-Signature header.
      - name: Multi-Location Support
        description: >-
          Model sites that group multiple locations and target leads and events
          at specific locations.
  - type: UseCases
    data:
      - name: Website Lead Forms
        description: >-
          Embed a public lead form on a website to push inquiries directly into
          Tripleseat via the lead form API.
      - name: CRM And Marketing Sync
        description: >-
          Synchronize accounts, contacts, and events with external CRM and
          email marketing platforms.
      - name: Real-Time Integrations
        description: >-
          React to lead creation and conversion in real time using webhooks to
          drive downstream automation.
      - name: Reporting And Analytics
        description: >-
          Extract events and leads into data warehouses and dashboards for sales
          reporting.
  - type: Integrations
    data:
      - name: SevenRooms
        description: >-
          Reservation, seating, and guest management platform that shares
          reservation and event details with Tripleseat.
      - name: OpenTable Guest Center
        description: >-
          Connect Tripleseat events to OpenTable guest center bookings to avoid
          double bookings.
      - name: Tock
        description: >-
          Collect private event leads from Tock and transfer them into
          Tripleseat.
      - name: Square
        description: >-
          Tripleseat integration available through the Square App Marketplace.
