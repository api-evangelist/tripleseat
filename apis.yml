aid: tripleseat
name: Tripleseat
description: >-
  Tripleseat is event management and catering sales software for restaurants,
  hotels, and unique venues, helping operators capture leads, book events, and
  manage the sales lifecycle. Tripleseat provides a public REST API and webhooks
  for partners and customers to integrate event and lead data with external
  systems. The API exposes endpoints for leads, events, accounts, contacts,
  locations, sites, and users, and supports a public lead form for capturing
  inquiries directly into Tripleseat. Webhooks emit trigger events such as
  CREATE_LEAD, CONVERT_LEAD, and CONVERT_LEAD_TO_BOOKING, signed with a
  SHA256-HMAC X-Signature header. Authentication moved from OAuth 1.0 to OAuth
  2.0, with OAuth 1.0 discontinued on July 1, 2026, and v1 endpoints served from
  api.tripleseat.com.
type: Index
image: https://kinlane-productions.s3.amazonaws.com/apis-json/apis-json-logo.jpg
tags:
  - Restaurant
  - Events
  - Catering
  - Leads
  - Webhooks
  - Sales
