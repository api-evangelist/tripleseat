aid: tripleseat
name: Tripleseat
description: >-
  Tripleseat is event management and catering sales software for restaurants,
  hotels, and unique venues, helping operators capture leads, book events, and
  manage the sales lifecycle. Tripleseat provides a public REST API and webhooks
  for partners and customers to integrate event and lead data with external
  systems. The API exposes endpoints for leads, accounts, users, and sites, and
  supports a public lead form for capturing inquiries directly into Tripleseat.
  Webhooks emit trigger events such as lead creation, lead conversion, and
  booking changes, signed with an X-Signature header. Authentication moved from
  OAuth 1.0 to OAuth 2.0, with v1 endpoints under api.tripleseat.com.
type: Index
