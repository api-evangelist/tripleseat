apis:
  - aid: tripleseat:rest-api
    name: Tripleseat API
    description: >-
      The Tripleseat REST API provides access to leads, accounts, users, and
      sites for event and catering sales workflows. A public lead form endpoint
      captures inquiries directly into Tripleseat, and webhooks emit events such
      as CREATE_LEAD, CONVERT_LEAD, and CONVERT_LEAD_TO_BOOKING to subscriber
      URLs. The API uses OAuth 2.0 authentication and is served from
      api.tripleseat.com under the v1 path.
