apis:
  - aid: tripleseat:rest-api
    name: Tripleseat API
    description: >-
      The Tripleseat REST API provides access to leads, events, accounts,
      contacts, locations, sites, and users for event and catering sales
      workflows. A public lead form endpoint captures inquiries directly into
      Tripleseat, and webhooks emit events such as CREATE_LEAD, CONVERT_LEAD,
      and CONVERT_LEAD_TO_BOOKING to subscriber URLs. The API uses OAuth 2.0
      authentication, paginates 50 records per page via the page parameter,
      enforces a 10 requests-per-second limit on leads and events endpoints, and
      is served from api.tripleseat.com under the v1 path.
    humanURL: https://support.tripleseat.com/hc/en-us/articles/205162108-API-Overview
