naftiko: 1.0.0-alpha2
info:
  label: Tripleseat API — Contacts
  description: 'Contacts — Create and associate contacts with accounts. 1 operations. Lead operation: Create Contact. Self-contained Naftiko capability covering one Tripleseat business surface.'
  tags:
  - Tripleseat
  - Events
  - Contacts
  created: '2026-06-03'
  modified: '2026-06-03'
binds:
- namespace: env
  keys:
    TRIPLESEAT_TOKEN: TRIPLESEAT_TOKEN
capability:
  consumes:
  - type: http
    namespace: tripleseat-contacts
    baseUri: https://api.tripleseat.com
    description: Tripleseat API — Contacts business capability. Self-contained, no shared references.
    authentication:
      type: bearer
      token: '{{env.TRIPLESEAT_TOKEN}}'
    resources:
    - name: v1-contacts-json
      path: /v1/contacts.json
      operations:
      - name: createContact
        method: POST
        description: Create Contact
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
          description: Request body payload.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: tripleseat-contacts-rest
    port: 8080
    description: REST adapter for Tripleseat API — Contacts. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/contacts-json
      name: contacts-json
      description: REST surface for Create Contact.
      operations:
      - method: POST
        name: createContact
        description: Create Contact
        call: tripleseat-contacts.createContact
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: tripleseat-contacts-mcp
    port: 9090
    transport: http
    description: MCP adapter for Tripleseat API — Contacts. One tool per consumed operation, routed inline through this capability's consumes block.
    tools:
    - name: create-contact
      description: Create Contact
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: tripleseat-contacts.createContact
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
