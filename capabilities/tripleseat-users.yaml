naftiko: 1.0.0-alpha2
info:
  label: Tripleseat API — Users
  description: 'Users — Retrieve Tripleseat users. 2 operations. Lead operation: List Users. Self-contained Naftiko capability covering one Tripleseat business surface.'
  tags:
  - Tripleseat
  - Events
  - Users
  created: '2026-06-03'
  modified: '2026-06-03'
binds:
- namespace: env
  keys:
    TRIPLESEAT_TOKEN: TRIPLESEAT_TOKEN
capability:
  consumes:
  - type: http
    namespace: tripleseat-users
    baseUri: https://api.tripleseat.com
    description: Tripleseat API — Users business capability. Self-contained, no shared references.
    authentication:
      type: bearer
      token: '{{env.TRIPLESEAT_TOKEN}}'
    resources:
    - name: v1-users-json
      path: /v1/users.json
      operations:
      - name: listUsers
        method: GET
        description: List Users
        inputParameters:
        - name: page
          in: query
          type: integer
          required: false
          description: The page of results to return. Each page contains 50 records.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: v1-users-user-id-json
      path: /v1/users/{user_id}.json
      operations:
      - name: getUser
        method: GET
        description: Get User
        inputParameters:
        - name: user_id
          in: path
          type: integer
          required: true
          description: The unique identifier of the user.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: tripleseat-users-rest
    port: 8080
    description: REST adapter for Tripleseat API — Users. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/users-json
      name: users-json
      description: REST surface for List Users.
      operations:
      - method: GET
        name: listUsers
        description: List Users
        call: tripleseat-users.listUsers
        with:
          page: rest.page
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/users-user-id-json
      name: users-user-id-json
      description: REST surface for Get User.
      operations:
      - method: GET
        name: getUser
        description: Get User
        call: tripleseat-users.getUser
        with:
          user_id: rest.user_id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: tripleseat-users-mcp
    port: 9090
    transport: http
    description: MCP adapter for Tripleseat API — Users. One tool per consumed operation, routed inline through this capability's consumes block.
    tools:
    - name: list-users
      description: List Users
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: tripleseat-users.listUsers
      with:
        page: tools.page
      outputParameters:
      - type: object
        mapping: $.
    - name: get-user
      description: Get User
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: tripleseat-users.getUser
      with:
        user_id: tools.user_id
      outputParameters:
      - type: object
        mapping: $.
