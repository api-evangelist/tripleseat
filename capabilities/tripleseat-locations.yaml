naftiko: 1.0.0-alpha2
info:
  label: Tripleseat API — Locations
  description: 'Locations — Retrieve locations within a site. 1 operations. Lead operation: List Locations. Self-contained Naftiko capability covering one Tripleseat business surface.'
  tags:
  - Tripleseat
  - Events
  - Locations
  created: '2026-06-03'
  modified: '2026-06-03'
binds:
- namespace: env
  keys:
    TRIPLESEAT_TOKEN: TRIPLESEAT_TOKEN
capability:
  consumes:
  - type: http
    namespace: tripleseat-locations
    baseUri: https://api.tripleseat.com
    description: Tripleseat API — Locations business capability. Self-contained, no shared references.
    authentication:
      type: bearer
      token: '{{env.TRIPLESEAT_TOKEN}}'
    resources:
    - name: v1-locations-json
      path: /v1/locations.json
      operations:
      - name: listLocations
        method: GET
        description: List Locations
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: tripleseat-locations-rest
    port: 8080
    description: REST adapter for Tripleseat API — Locations. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/locations-json
      name: locations-json
      description: REST surface for List Locations.
      operations:
      - method: GET
        name: listLocations
        description: List Locations
        call: tripleseat-locations.listLocations
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: tripleseat-locations-mcp
    port: 9090
    transport: http
    description: MCP adapter for Tripleseat API — Locations. One tool per consumed operation, routed inline through this capability's consumes block.
    tools:
    - name: list-locations
      description: List Locations
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: tripleseat-locations.listLocations
      outputParameters:
      - type: object
        mapping: $.
