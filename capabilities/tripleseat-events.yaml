naftiko: 1.0.0-alpha2
info:
  label: Tripleseat API — Events
  description: 'Events — Retrieve events and their bookings. 3 operations. Lead operation: List Events. Self-contained Naftiko capability covering one Tripleseat business surface.'
  tags:
  - Tripleseat
  - Events
  - Events
  created: '2026-06-03'
  modified: '2026-06-03'
binds:
- namespace: env
  keys:
    TRIPLESEAT_TOKEN: TRIPLESEAT_TOKEN
capability:
  consumes:
  - type: http
    namespace: tripleseat-events
    baseUri: https://api.tripleseat.com
    description: Tripleseat API — Events business capability. Self-contained, no shared references.
    authentication:
      type: bearer
      token: '{{env.TRIPLESEAT_TOKEN}}'
    resources:
    - name: v1-events-json
      path: /v1/events.json
      operations:
      - name: listEvents
        method: GET
        description: List Events
        inputParameters:
        - name: page
          in: query
          type: integer
          required: false
          description: The page of results to return. Each page contains 50 records.
        - name: order
          in: query
          type: string
          required: false
          description: Field to order results by (for example, event_start).
        - name: sort_direction
          in: query
          type: string
          required: false
          description: Sort direction for the ordered field.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: v1-events-event-id-json
      path: /v1/events/{event_id}.json
      operations:
      - name: getEvent
        method: GET
        description: Get Event
        inputParameters:
        - name: event_id
          in: path
          type: integer
          required: true
          description: The unique identifier of the event.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: v1-events-search-json
      path: /v1/events/search.json
      operations:
      - name: searchEvents
        method: GET
        description: Search Events
        inputParameters:
        - name: page
          in: query
          type: integer
          required: false
          description: The page of results to return. Each page contains 50 records.
        - name: updated_after
          in: query
          type: string
          required: false
          description: Return events updated after this timestamp.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: tripleseat-events-rest
    port: 8080
    description: REST adapter for Tripleseat API — Events. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/events-json
      name: events-json
      description: REST surface for List Events.
      operations:
      - method: GET
        name: listEvents
        description: List Events
        call: tripleseat-events.listEvents
        with:
          page: rest.page
          order: rest.order
          sort_direction: rest.sort_direction
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/events-event-id-json
      name: events-event-id-json
      description: REST surface for Get Event.
      operations:
      - method: GET
        name: getEvent
        description: Get Event
        call: tripleseat-events.getEvent
        with:
          event_id: rest.event_id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/events-search-json
      name: events-search-json
      description: REST surface for Search Events.
      operations:
      - method: GET
        name: searchEvents
        description: Search Events
        call: tripleseat-events.searchEvents
        with:
          page: rest.page
          updated_after: rest.updated_after
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: tripleseat-events-mcp
    port: 9090
    transport: http
    description: MCP adapter for Tripleseat API — Events. One tool per consumed operation, routed inline through this capability's consumes block.
    tools:
    - name: list-events
      description: List Events
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: tripleseat-events.listEvents
      with:
        page: tools.page
        order: tools.order
        sort_direction: tools.sort_direction
      outputParameters:
      - type: object
        mapping: $.
    - name: get-event
      description: Get Event
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: tripleseat-events.getEvent
      with:
        event_id: tools.event_id
      outputParameters:
      - type: object
        mapping: $.
    - name: search-events
      description: Search Events
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: tripleseat-events.searchEvents
      with:
        page: tools.page
        updated_after: tools.updated_after
      outputParameters:
      - type: object
        mapping: $.
